name: Export and deploy Godot Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
         - name: Create Web export preset
        run: |
          mkdir -p web
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          export_filter="all_resources"
          export_path="web/index.html"

          [preset.0.options]
          EOF

      - name: Export Web
        run: godot --headless --path . --export-release "Web" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
